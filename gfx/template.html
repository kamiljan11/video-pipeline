<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(file:///home/kamil-jan/.local/share/fonts/Montserrat-VF.ttf)}
:root{--acc:#2de2c4;--ink:#0d0f12}
html,body{margin:0;width:2560px;height:1440px;background:transparent;overflow:hidden;font-family:M,sans-serif}
.kw{position:absolute;top:50%;transform:translateY(-50%);max-width:660px;background:rgba(13,15,18,.78);padding:40px 52px 44px;border-radius:22px;animation:fade .3s both}
.kw.right{right:70px;text-align:left}.kw.left{left:110px}
.kw .t{display:inline-block;font-weight:900;font-size:76px;line-height:1.08;color:#fff;letter-spacing:-2px;
 text-shadow:0 8px 40px rgba(0,0,0,.55);animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.kw .bar{height:16px;background:var(--acc);border-radius:8px;margin-top:22px;transform-origin:left;animation:grow .5s .15s ease-out both}

.kw .s{font-weight:600;font-size:46px;color:#e9fffb;margin-top:18px;text-shadow:0 4px 20px rgba(0,0,0,.6);animation:fade .4s .3s both}
.lower{position:absolute;left:140px;bottom:150px;display:flex;align-items:stretch;animation:slide .55s cubic-bezier(.2,.9,.2,1) both}
.lower .acc{width:16px;background:var(--acc);border-radius:6px 0 0 6px}
.lower .box{background:rgba(13,15,18,.86);padding:26px 44px;border-radius:0 14px 14px 0}
.lower .n{font-weight:800;font-size:64px;color:#fff}.lower .r{font-weight:500;font-size:38px;color:var(--acc);margin-top:6px}
.chap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
 background:radial-gradient(ellipse at center,rgba(13,15,18,.80),rgba(13,15,18,.95));animation:fade .35s both}
.chap .no{font-weight:700;font-size:44px;color:var(--acc);letter-spacing:12px;animation:fade .4s .1s both}
.chap .t{font-weight:900;font-size:124px;color:#fff;margin-top:20px;text-align:center;max-width:2000px;line-height:1.05;animation:pop .5s .15s cubic-bezier(.2,1.4,.4,1) both}
.list{position:absolute;right:70px;top:50%;transform:translateY(-50%);background:rgba(13,15,18,.80);padding:44px 56px;border-radius:22px;width:700px;animation:fade .3s both}
.list .h{font-weight:900;font-size:64px;color:#fff;margin-bottom:26px}
.list .i{display:flex;gap:26px;align-items:center;font-weight:600;font-size:46px;color:#f2fffc;margin:18px 0;line-height:1.15}
.list .i b{color:var(--acc);font-weight:900;font-size:54px;min-width:46px}
.list .i:nth-child(2){animation:slide .45s .2s both}.list .i:nth-child(3){animation:slide .45s 1.4s both}.list .i:nth-child(4){animation:slide .45s 2.8s both}
.endc{position:absolute;inset:0;background:#0d0f12;display:flex;flex-direction:column;justify-content:center;padding-left:200px}
.endc .t{font-weight:900;font-size:110px;color:#fff;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.endc .bar{width:420px;height:18px;background:var(--acc);border-radius:9px;margin:34px 0;transform-origin:left;animation:grow .5s .2s both}
.endc .s{font-weight:600;font-size:56px;color:var(--acc);animation:fade .4s .35s both}
.ic{width:96px;height:96px;border-radius:24px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:icpop .55s cubic-bezier(.2,1.8,.4,1) both}
.ic svg{width:58px;height:58px;stroke:#0d0f12;stroke-width:2.4}
.list .i .li{display:flex;align-items:center;justify-content:center;min-width:64px;height:64px;border-radius:16px;background:rgba(45,226,196,.16)}
.list .i .li svg{width:40px;height:40px;stroke:var(--acc);stroke-width:2.4}
@keyframes icpop{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
.cta{position:absolute;left:140px;bottom:150px;display:flex;align-items:center;gap:28px;background:rgba(13,15,18,.88);padding:20px 40px 20px 20px;border-radius:999px;animation:slide .5s cubic-bezier(.2,.9,.2,1) both}
.cta .btn{display:flex;align-items:center;gap:16px;background:var(--acc);color:#0d0f12;font-weight:800;font-size:46px;padding:18px 36px;border-radius:999px;animation:pop .5s .2s cubic-bezier(.2,1.6,.4,1) both}
.cta .btn svg{width:46px;height:46px;stroke:#0d0f12;stroke-width:2.4;transform-origin:50% 10%;animation:ring 1s .7s ease-in-out 2}
.cta .s{font-weight:600;font-size:40px;color:#fff;animation:fade .4s .4s both}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.slide{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#16201f,#0b0d10 70%);animation:fade .35s both}
.slide .in{position:absolute;left:150px;top:46%;transform:translateY(-50%);width:1640px}
.slide .kick{font-weight:700;font-size:40px;letter-spacing:10px;color:var(--acc);text-transform:uppercase;animation:fade .4s .1s both}
.slide h1{font-weight:900;font-size:92px;line-height:1.05;color:#fff;margin:22px 0 60px;animation:pop .5s .15s cubic-bezier(.2,1.4,.4,1) both}
.slide .row{display:flex;align-items:center;gap:36px;margin:30px 0}
.slide .lab{width:520px;font-weight:700;font-size:44px;color:#e9fffb;line-height:1.15}
.slide .lab small{display:block;font-weight:500;font-size:32px;color:#9fb7b2;margin-top:6px}
.slide .bar{height:84px;border-radius:14px;background:#2a3332;transform-origin:left;display:flex;align-items:center;padding-left:28px;font-weight:800;font-size:38px;color:#cfe8e3}
.slide .bar.a{color:#0d0f12}
.slide .bar.a{background:var(--acc)}
.slide .people{display:flex;gap:40px;margin:40px 0 50px}
.slide .people svg{width:200px;height:200px;stroke:#3a4544;stroke-width:1.6}
.slide .people .on svg{stroke:var(--acc)}
.slide .people div{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.slide .big{font-weight:900;font-size:76px;color:#fff;line-height:1.1}
.slide .big b{color:var(--acc)}
.slide .src{position:absolute;left:150px;bottom:90px;font-weight:500;font-size:30px;color:#7d8f8b}
/* 9:16 shorts (spec canvas "v"): card in the top band, above the face (~40% height) and the captions (bottom third) */
.web{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#16201f,#0b0d10 70%);animation:fade .35s both}
.web .win{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.55);animation:pop .5s .1s cubic-bezier(.2,1.2,.4,1) both}
.web .top{height:64px;background:#e9ecef;display:flex;align-items:center;gap:14px;padding:0 26px}
.web .top i{width:20px;height:20px;border-radius:50%;background:#ff5f57}.web .top i:nth-child(2){background:#febc2e}.web .top i:nth-child(3){background:#28c840}
.web .tab{margin-left:22px;max-width:900px;background:#fff;border-radius:14px 14px 0 0;align-self:flex-end;padding:14px 28px;font-weight:600;font-size:26px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .addr{height:58px;background:#fff;border-bottom:2px solid #e3e6e9;display:flex;align-items:center;gap:14px;padding:0 30px;font-weight:500;font-size:26px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .lock{width:16px;height:12px;border:3px solid #777;border-radius:3px;position:relative;top:4px}.web .lock::before{content:"";position:absolute;left:1px;top:-12px;width:8px;height:9px;border:3px solid #777;border-bottom:0;border-radius:6px 6px 0 0}
.web .view{position:relative;overflow:hidden;background:#fff}
.web .shot{position:absolute;left:0;top:0}.web .shot img{display:block}
.web .hl{position:absolute;background:rgba(255,214,0,.5);mix-blend-mode:multiply;border-bottom:6px solid var(--acc);border-radius:6px;transform-origin:left;animation-fill-mode:both}
@keyframes hl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.web .src{position:absolute;left:150px;bottom:44px;font-weight:500;font-size:30px;color:#7d8f8b}
html.v,html.v body{width:1080px;height:1920px}
html.v .kw{top:170px;left:50%;right:auto;transform:translateX(-50%);max-width:900px;text-align:center;padding:36px 56px 40px}
html.v .kw .ic{margin:0 auto 20px}
html.v .kw .t{font-size:104px;letter-spacing:-3px}
html.v .kw .s{font-size:50px}
html.v .kw .bar{margin:20px auto 0;width:60%}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#root.out{animation:outA .35s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes outA{from{opacity:1}to{opacity:0}}
</style></head><body><div id="root"></div></body></html>
