@keyframes flpop{from{opacity:0;transform:scale(.3) rotate(var(--r0,-8deg))}70%{opacity:1;transform:scale(1.08) rotate(var(--r,0deg))}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}

@keyframes flgrowy{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* 9:16 shorts (spec canvas "v"): card in the top band, above the face (~40% height) and the captions (bottom third) */
.web{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,var(--bg-a),var(--bg-b) 70%);animation:fade .35s both}
.web .win{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.55);animation:pop .5s .1s cubic-bezier(.2,1.2,.4,1) both}
.web .top{height:64px;background:#e9ecef;display:flex;align-items:center;gap:14px;padding:0 26px}
.web .top i{width:20px;height:20px;border-radius:50%;background:#ff5f57}.web .top i:nth-child(2){background:#febc2e}.web .top i:nth-child(3){background:#28c840}
.web .tab{margin-left:22px;max-width:900px;background:#fff;border-radius:14px 14px 0 0;align-self:flex-end;padding:14px 28px;font-weight:600;font-size:26px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .addr{height:58px;background:#fff;border-bottom:2px solid #e3e6e9;display:flex;align-items:center;gap:14px;padding:0 30px;font-weight:500;font-size:26px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .lock{width:16px;height:12px;border:3px solid #777;border-radius:3px;position:relative;top:4px}.web .lock::before{content:"";position:absolute;left:1px;top:-12px;width:8px;height:9px;border:3px solid #777;border-bottom:0;border-radius:6px 6px 0 0}

html.v,html.v body{width:1080px;height:1920px}

/* "pill" maxim = 9:16 hook card (render/montaz/2026-10-22/STYL-SHORTOW.md R1): white pill from ~61 % height down (under the
   chin: higher it covered the mouth on short1 2026-10-24; Kamil 2026-10-24: still half the face -> lower, see-through), where the captions are, accent words in --acc-dim (contrast on white); build_edl.py leaves the captions out while it is on */

html.v .endc .brand{align-items:center;margin-top:80px}html.v .endc .brand img{height:64px}html.v .endc .brand .u{font-size:44px}
