name: quality
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the secrets gate reads the gl-ok-<blob sha> label (ADR-0029)
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  test:
    # a label added or removed changes no code: only the secrets job reads labels (ADR-0029)
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # npm test alone takes ~15 min on a hosted runner (2026-11-22: 20 cut the last step)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # no symlink to the author's path: the checkout is /home/runner/work/..., so CI proves the repo runs from any clone
      - name: System tools as README "Quick start" (ffmpeg 8 from install/ffmpeg.sh, apt has 6.1; poppler, tesseract; the card font)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-pol fonts-dejavu-extra
          bash install/ffmpeg.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.local/share/fonts && cp fonts/Montserrat-VF.ttf ~/.local/share/fonts/ && fc-cache -f
          test -x /usr/bin/google-chrome
      - name: ffmpeg on PATH is the pinned 8.x, not apt's 6.1
        run: ffmpeg -version | head -1 | tee /dev/stderr | grep -q '^ffmpeg version n8\.'
      - name: Installers as a stranger meets them (shellcheck; ffmpeg.sh rerun skips, repairs a missing ffprobe; model URLs answer)
        run: |
          shellcheck -S warning install/*.sh run_v4.sh run_whisper.sh
          o=$(bash install/ffmpeg.sh "$HOME/.local/bin"); echo "$o"; grep -q 'already in' <<<"$o"
          rm "$HOME/.local/bin/ffprobe"
          o=$(bash install/ffmpeg.sh "$HOME/.local/bin"); echo "$o"; if grep -q 'already in' <<<"$o"; then echo 'FAILED: a missing ffprobe was not reinstalled'; exit 1; fi
          "$HOME/.local/bin/ffprobe" -version | head -1
          bash install/fetch_models.sh --check-urls
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          npm ci
          python -m venv .venv && .venv/bin/pip install -r requirements.txt ruff==0.16.10
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Card tests (node --test)
        run: npm test
      - name: Python tests (no models, no recordings needed)
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: "Text-behind tests (matte/, fake matting, no model needed)"
        run: .venv/bin/python -m unittest matte/test_behind.py -v
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A changed .gitleaksignore needs the owner's label for exactly this content (ADR-0029)
        # the format check below cannot tell a reviewed false positive from a PR allow-listing its own leak;
        # the label names the blob the owner read (gl-ok-<its full 40-hex sha>; a short prefix can be forged by
        # brute-forcing a comment line, 8 hex took 32 s), so a later change of the file on any PR event no longer matches
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git diff --quiet "$BASE_SHA" HEAD -- .gitleaksignore && exit 0
          blob=$(git rev-parse HEAD:.gitleaksignore 2>/dev/null)
          want="gl-ok-${blob:-deleted}"
          case " $LABELS " in *" $want "*) echo "reviewed: $want" ;; *)
            echo "::error file=.gitleaksignore::changed in this PR: the owner checks each entry, then adds the label $want (it names this exact content)"
            exit 1 ;;
          esac
      - name: Gitleaks (whole history, built-in rules only)
        run: |
          # a committed .gitleaks.toml would let the repo turn rules off or allow-list by path/regex
          test ! -e .gitleaks.toml
          # .gitleaksignore only as exact per-commit fingerprints of reviewed false positives (ADR-0029):
          # sha:path:rule:line. A fingerprint without the commit would hide the finding in every commit.
          if [ -e .gitleaksignore ]; then
            if grep -nvE '^([0-9a-f]{40}:[^:]+:[a-z0-9-]+:[0-9]+|#.*|)$' .gitleaksignore; then
              echo "::error file=.gitleaksignore::only full sha:path:rule:line lines (ADR-0029)"; exit 1
            fi
            grep -oE '^[0-9a-f]{40}' .gitleaksignore | while read -r sha; do
              git cat-file -e "$sha^{commit}" || { echo "::error file=.gitleaksignore::unknown commit $sha"; exit 1; }
            done
            echo "Ignored findings (reviewed false positives):"; grep -vE '^(#|$)' .gitleaksignore
          fi
          # gitleaks also skips any line carrying its inline allow comment; none may exist anywhere in history
          if git log --all -p | grep -n 'gitleaks[:]allow'; then
            echo "::error::inline gitleaks allow comment in history (ADR-0029)"; exit 1
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact --verbose --exit-code 1
