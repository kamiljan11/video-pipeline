name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Author's path (scripts expect the checkout at /home/kamil-jan/video-pipeline, README "Quick start")
        run: sudo mkdir -p /home/kamil-jan && sudo ln -s "$GITHUB_WORKSPACE" /home/kamil-jan/video-pipeline
      - name: System tools (ffmpeg 8 as on the author's machine, apt has 6.1; poppler for web/PDF cards; Chrome for cards)
        env:
          # month-end autobuilds stay published; daily ones are pruned after ~2 weeks (2026-10-24 was, CI went 404)
          FFMPEG_RELEASE: autobuild-2026-10-31-12-59
          FFMPEG_TAR: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-pol fonts-dejavu-extra
          curl -fsSL -o "/tmp/$FFMPEG_TAR" "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_TAR"
          echo "$FFMPEG_SHA256  /tmp/$FFMPEG_TAR" | sha256sum -c -
          tar -xJf "/tmp/$FFMPEG_TAR" -C /tmp && sudo cp /tmp/${FFMPEG_TAR%.tar.xz}/bin/ff* /usr/local/bin/
          ffmpeg -version | head -1
          test -x /usr/bin/google-chrome
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          npm ci
          python -m venv .venv && .venv/bin/pip install -r requirements.txt ruff==0.16.10
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Card tests (node --test)
        run: npm test
      - name: Python tests (no models, no recordings needed)
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: "Text-behind tests (matte/, fake matting, no model needed)"
        run: .venv/bin/python -m unittest matte/test_behind.py -v
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (whole history, built-in rules only)
        run: |
          # a committed .gitleaks.toml / .gitleaksignore would let the repo allow-list its own leak
          test ! -e .gitleaks.toml && test ! -e .gitleaksignore
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact --verbose --exit-code 1
